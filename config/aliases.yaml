# Normalization lookup tables. Used by tracker/normalize.py.
# Keys are compared casefolded and punctuation-stripped.

# Company suffixes stripped before comparison. Order matters (longest first).
company_suffixes:
  - "limited"
  - "ltd"
  - "plc"
  - "llc"
  - "llp"
  - "lp"
  - "inc"
  - "incorporated"
  - "corporation"
  - "corp"
  - "gmbh"
  - "group"
  - "holdings"
  - "uk"
  - "technologies"
  - "technology"

# Known company name variants -> canonical name.
company_aliases:
  "arm": "Arm"
  "arm holdings": "Arm"
  "nvidia corporation": "NVIDIA"
  "nvidia": "NVIDIA"
  "jp morgan": "J.P. Morgan"
  "jpmorgan chase": "J.P. Morgan"
  "j p morgan": "J.P. Morgan"
  # TargetJobs lists J.P. Morgan as "JPMC" (found 2026-09-16).
  "jpmc": "J.P. Morgan"
  "j.p. morgan": "J.P. Morgan"
  "j.p. morgan chase": "J.P. Morgan"
  "jpmorgan": "J.P. Morgan"
  # The Workday board id reads as one word (found 2026-09-20).
  "jpmorganchase": "J.P. Morgan"
  # Board ids read as one word too (found 2026-09-21).
  "mbdacareers": "MBDA"
  "mbda careers": "MBDA"
  "airbusgroup": "Airbus"
  "mmc careers": "Marsh McLennan"
  "mmccareers": "Marsh McLennan"
  "goldman sachs": "Goldman Sachs"
  "amazon web services": "Amazon"
  "aws": "Amazon"
  "google": "Google"
  "alphabet": "Google"
  "meta platforms": "Meta"
  "facebook": "Meta"
  "microsoft": "Microsoft"
  "ibm united kingdom": "IBM"
  "bae systems": "BAE Systems"
  "rolls royce": "Rolls-Royce"
  "dyson": "Dyson"
  "arup": "Arup"
