# Title token expansions applied before comparison.
title_expansions:
  "swe": "software engineer"
  "sde": "software engineer"
  "se": "software engineer"
  "ml": "machine learning"
  "ai": "artificial intelligence"
  "cs": "computer science"
  "qa": "quality assurance"
  "sre": "site reliability engineer"
  "ds": "data science"
  "fe": "frontend"
  "be": "backend"
  # Verb/noun forms of the same role must converge, or "Software Engineering
  # Intern" and "Software Engineer Intern" dedupe as two different jobs.
  "engineering": "engineer"
  "development": "developer"
  "developement": "developer"
  "sciences": "science"
  "analytics": "analyst"

# Noise removed from titles before comparison. These do not distinguish one
# role from another, so leaving them in would block legitimate merges.
title_noise:
  - "internship"
  - "intern"
  - "placement"
  - "industrial placement"
  - "summer"
  - "summer 2026"
  - "summer 2027"
  - "2026"
  - "2027"
  - "2028"
  - "uk"
  - "london"
  - "12 month"
  - "12 months"
  - "6 month"
