# Deadline and open/closed verification.
#
# Aggregators routinely leave a role listed after the employer has closed it,
# and often show no deadline at all. So after deduplication (one visit per real
# job, not one per platform) the verifier opens the actual job page and, when
# that is still unclear, follows through to the employer's own application page.
#
# The verifier never guesses. If it cannot establish the state it records
# UNKNOWN, which the workbook displays plainly.

enabled: true

budget:
  # Hard ceiling on pages fetched per run, spent highest-priority first.
  max_verifications: 120
  # Do not re-check a job that was checked within this many days...
  revalidate_after_days: 3
  # ...except for these, which are always re-checked.
  always_verify:
    new_jobs: true
    priority: ["HIGH"]
    open_status: ["UNKNOWN"]
    deadline_within_days: 14

# Follow application_url to the employer's own ATS when the source page did not
# settle the question. This is where the truth usually lives, especially for
# Trackr rows whose url field points straight at Greenhouse/Workday/etc.
follow_application_url: true

# An HTTP 404 or 410 on the application URL means the posting is unavailable,
# not that hiring has closed: UNKNOWN, with the response in the note (the
# assessment reads it as UNAVAILABLE). Other error codes are UNKNOWN too.
treat_404_as_closed: false

# Case-insensitive substrings. Matching any of these marks the job CLOSED.
closed_markers:
  - "applications are closed"
  - "applications closed"
  - "application deadline has passed"
  - "no longer accepting applications"
  - "no longer accepting"
  - "this vacancy has expired"
  - "this job has expired"
  - "vacancy is now closed"
  - "position has been filled"
  - "role has been filled"
  - "closed for applications"
  - "we are no longer taking applications"
  - "job not found"
  - "this opportunity is no longer available"
  - "posting is no longer active"

# Matching any of these marks the job OPEN, and outranks a closed marker only
# when it appears in the page's main content rather than boilerplate.
open_markers:
  - "apply now"
  - "submit your application"
  - "start your application"
  - "applications close"
  - "accepting applications"
  - "apply for this role"
  - "apply for this job"

# Labels that introduce a deadline date on a job page. The parser looks for a
# date within the following 80 characters.
deadline_labels:
  - "application deadline"
  - "applications close"
  - "closing date"
  - "deadline"
  - "apply by"
  - "close date"
  - "applications must be received by"

# UK sites: 03/04/2027 means 3 April, not 4 March. Never change this without
# also changing the normalizer.
dayfirst: true

# When the verified deadline and the platform's listed deadline disagree by
# more than this many days, the row is flagged for review. Both dates are kept.
deadline_disagreement_flag_days: 2

# `main.py eligibility`: at most this many employer postings are read per run for
# who may apply. Rows a careers feed already described are not read again.
eligibility_max_pages: 600
# Never read for eligibility: aggregators and job sites whose pages list many
# programmes, or which a row with no employer link points at instead.
eligibility_skip_hosts: [the-trackr.com, gradcracker.com, brightnetwork.co.uk, linkedin.com, higherin.com,
                         targetjobs.co.uk]

# ---------------------------------------------------------------------------
# Deadline evidence (tracker/deadline_extract.py). Read only once the
# assessment is switched on (config/relevance.yaml apply_to_workbook) or by
# `main.py assess --dry-run`. Until then the labels above are what is used.
# ---------------------------------------------------------------------------

# A date is a deadline only when its own clause says so. Strong phrases count
# anywhere in the clause before the date (or just after it: "3 October is the
# closing date"); weak words only within `weak_cue_chars` of the date.
deadline_phrases:
  - "apply before"
  - "apply by"
  - "apply no later than"
  - "applications close"
  - "applications will close"
  - "applications must be received by"
  - "application deadline"
  - "deadline for applications"
  - "closing date"
  - "close date"
  - "last date to apply"
  - "open until"
  - "closes on"
  - "will close on"
  - "no later than"
deadline_weak_words: ["deadline", "close", "closes", "closing"]
weak_cue_chars: 40
# Words that make a date something else - they win when nearer the date than
# any deadline phrase.
not_deadline_words: ["posted", "published", "updated", "start", "starts", "starting", "start date",
                     "commence", "commences", "commencing", "event", "held on", "takes place", "interview",
                     "interviews", "assessment centre", "assessment center", "open on", "opens on",
                     "opening on", "will open", "opened", "meet deadlines", "meeting deadlines", "runs from",
                     "from", "until graduation", "graduating", "graduate in", "date of birth",
                     "programme dates", "programme date", "programme runs", "internship dates",
                     "placement dates", "scheme dates", "dates", "end date", "ends", "ending", "finishes",
                     "duration", "runs", "running from", "returning"]
# Rolling recruitment: noted on the row, never turned into a date.
rolling_phrases: ["rolling basis", "on a rolling", "may close early", "close early", "as soon as possible",
                  "until filled", "until the position is filled"]

# Numeric dates (03/04/2026) are read only in an order the SOURCE states: the
# page's <html lang>, a locale in its URL, or a platform listed below. Where
# neither part is above 12 and no order is stated, the date is AMBIGUOUS.
locale_date_order:
  en-gb: dayfirst
  en-ie: dayfirst
  en-au: dayfirst
  en-nz: dayfirst
  en-in: dayfirst
  en-za: dayfirst
  en-us: monthfirst
  fr: dayfirst
  de: dayfirst
  es: dayfirst
  it: dayfirst
  nl: dayfirst
  pt: dayfirst
  pl: dayfirst
# A platform is added here only after its convention has been checked and the
# evidence recorded (the dry-run report lists what to check). Empty on purpose.
platform_date_order: {}

# Platforms whose deadline field is the listing's schema.org validThrough
# (sources/jobboards.py, sources/brightnetwork.py): when the listing expires,
# not a deadline the employer stated. A passed date from one of these alone is
# REVIEW, never a reliable expiry, and keeps the row in the checking queue.
listing_expiry_fields: [higherin, targetjobs, brightnetwork]

# A fetched page is an application step - never read further - when its main
# content is a gate rather than a posting.
application_step_markers:
  sign_in: ["sign in", "log in", "login", "create account", "create an account", "register to apply",
            "forgot password", "forgotten password"]
  # Applicant fields: a form asking for several of these is data entry.
  applicant_fields: ["first name", "last name", "surname", "email", "phone", "mobile", "resume", "cv",
                     "cover letter", "date of birth", "address"]
  # A page with at least this much posting text is a posting, whatever else it has.
  posting_text_chars: 800
