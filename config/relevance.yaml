                  "currently working towards", "currently completing", "currently in your",
                  "currently in the", "currently at university", "current students", "current undergraduates",
                  "current undergraduate", "current university students", "undergraduate students",
                  "undergraduate student", "university students", "penultimate year", "penultimate-year",
                  "final year students", "final year student", "final-year students", "first year students",
                  "first-year students", "second year students", "second-year students",
                  "returning to university", "return to university", "year in industry", "placement year",
                  "sandwich year", "sandwich placement", "sandwich degree", "industrial placement year",
                  "pursuing a bachelor", "pursuing bachelor", "pursuing bachelors", "pursuing bachelor's",
                  "pursuing a degree", "pursuing an undergraduate", "enrolled in a",
                  "enrolled on a", "studying for a", "studying towards", "working towards a",
                  "working towards your", "undertaking a degree", "undertaking an undergraduate",
                  "completing a degree", "completing your degree", "completing an undergraduate",
                  "still at university", "during your degree", "as part of your degree", "as part of your studies",
