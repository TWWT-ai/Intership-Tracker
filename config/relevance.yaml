  # Integrated master's degrees: not assumed to be undergraduate degrees.
  integrated_masters: [meng, mcomp, msci, mmath, "m.eng", "integrated master's", "integrated masters"]
  bachelor_too: ["bachelor", "bachelors", "bachelor's", "undergraduate", "undergraduates", "bsc", "b.sc", "beng", "penultimate", "first year",
                 "second year", "final year", "year in industry", "placement year", "ba/bsc", "bs/ms"]
  # A title for someone who has graduated or has years of experience.
