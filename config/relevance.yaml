degree:
  # A sentence about degrees names one of these.
  cues: ["degree", "degrees", "studying", "study", "discipline", "disciplines", "subject", "subjects",
         "bsc", "b.sc", "beng", "meng", "ba", "major", "background in", "qualification", "course"]
  any: ["any degree", "any discipline", "any subject", "all degree disciplines", "all disciplines",
        "all degrees", "all subjects", "all academic backgrounds", "any academic background",
        "no specific degree", "degree in any", "from any background", "regardless of degree",
        "whatever your degree", "whatever you study", "whatever you're studying", "any field of study",
        "all degree subjects", "any degree subject", "open to all degree"]
  # Computer Science by name (joint honours naming it count: "Maths & Computer Science").
  cs_names: ["computer science", "computing", "software engineering", "computer engineering", "comp sci",
             "compsci", "cs"]
  # Named without Computer Science, these are recorded as EQUIVALENCE_UNCLEAR:
  # the employer's words are kept, equivalence is not assumed.
  equivalence_unclear: ["artificial intelligence", "ai", "data science", "informatics", "information technology",
                        "cyber security", "cybersecurity", "computer systems", "software development",
                        "machine learning", "or related", "or a related", "related discipline", "related field",
                        "related subject", "relevant discipline", "relevant degree", "or equivalent"]
  # A broad field, not a subject: BROAD_FIELD. Phrased as a degree or subject,
  # so "technical skills" or "science team" is not a degree requirement.
  broad_field: ["stem", "stem subject", "stem degree", "stem-related", "stem related", "engineering degree",
                "degree in engineering", "engineering discipline", "an engineering", "technical degree",
                "technical subject", "technical discipline", "numerate degree", "numerate subject",
                "numerate discipline", "science degree", "scientific degree", "quantitative degree",
                "quantitative subject", "quantitative discipline", "analytical degree", "analytical subject"]
  # Subjects that on their own exclude Computer Science when required.
  other_subjects: ["mechanical", "aerospace", "aeronautical", "civil", "structural", "chemical", "materials",
                   "manufacturing", "physics", "chemistry", "biology", "biomedical", "biochemistry",
                   "law", "legal", "accounting", "accountancy", "finance", "economics", "business",
                   "marketing", "psychology", "geography", "architecture", "surveying", "medicine",
                   "pharmacy", "nursing", "mathematics", "maths", "statistics", "actuarial", "geology",
                   "environmental", "nuclear", "naval", "marine", "electrical", "electronic", "electronics"]
  # A degree list with any of these is open-ended, so it cannot exclude.
  open_ended: ["related", "similar", "relevant", "equivalent", "other", "such as", "e.g", "for example",
               "including", "technical degree", "numerate", "quantitative", "engineering degree",
               "engineering discipline", "engineering disciplines"]
  required: ["must", "required", "requirement", "requirements", "requires", "need to be", "needs to be", "you will be studying",
             "you'll be studying", "should be studying", "essential", "you must be", "only open to",
             "eligible", "you need"]
  preferred: ["preferred", "preferable", "desirable", "ideally", "ideal", "nice to have", "advantageous",
