# A title naming computing. It never includes a role on its own, but it stops
# one being EXCLUDED for vague duties: that combination is REVIEW.
title_technical: [software, developer, technology, technologist, tech, it, cyber, data, analytics,
                  "machine learning", ml, ai, "artificial intelligence", cloud, devops, sre,
                  "site reliability", network, networks, backend, frontend, "full stack", quant,
                  quantitative, algorithmic, computing, computer, digital, electronics, electronic,
                  embedded, firmware, robotics, automation, "information management", informatics]

# Technology mentioned as a tool or a trait, not as the work. Removed before
# duties are counted, so "using data and technology" proves nothing.
incidental: ["using data and technology", "use data and technology", "using data", "use data",
             "data and research", "data, digital technology", "digital technology", "digital technologies",
             "technology and ai tools", "ai tools", "using technology", "use technology",
             "passion for technology", "interest in technology", "interest in tech", "tech-driven",
             "technology-driven", "technology driven", "data-driven", "data driven", "digital tools",
             "digital platforms", "digital experiences", "microsoft office", "ms office", "excel",
             "powerpoint", "digital and ai capability", "technology to", "tech savvy", "tech-savvy",
             "commercial aircraft", "commercial airbus", "external contracts", "commercial and military",
             "local law", "applicable law"]

# Counted in kinds of work (lines above), in the duties sections only.
# TECHNICAL: at least `technical_min` technical kinds and at least
# `technical_margin` more technical kinds than other kinds - a trading role that
# "explores statistical models" is mixed, not computing. NOT_TECHNICAL: at least `business_min` other
# kinds and no more than `incidental_tech_max` technical ones; with one fewer,
# only when the title also names a non-computing function or field (the
# careers lists `non_tech_function_terms` / `other_field_terms`) - the title
# breaks a tie, it never decides alone. Anything else is mixed: REVIEW.
technical_min: 2
technical_margin: 2
business_min: 3
incidental_tech_max: 1

