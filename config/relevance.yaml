  - "partnerships|partners"
  - "relationship management|relationship building|manage relationships|client relationships|clients|stakeholder management"
  - "commercial|deals|transactions|pricing"
  - "sales|selling|marketing|brand|marketing campaigns|advertising|market research|business development"
  - "customer insight|customer journeys|customer experience"
  - "financial analysis|financial modelling|accounting|valuation|mergers|acquisitions|investment|investments|portfolio|wealth|asset management|banking|credit|trading|underwriting|insurance"
  - "audit|audits|auditing|compliance|regulatory|risk management|controls|tax"
  - "legal|law firm|areas of law|lawyers|solicitors|contracts|litigation"
