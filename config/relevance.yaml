                      "completed your degree", "completed an undergraduate", "must have graduated",
                      "should have graduated", "have already graduated", "recent graduates only",
                      "graduates only", "graduated within the last", "hold a bachelor", "hold a degree",
                      "degree already obtained", "you have graduated", "new grad", "new graduate"]
  # Postgraduate-only, said in so many words (a mention of Master's is not enough).
