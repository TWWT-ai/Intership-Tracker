  - "write code|writing code|code|coding|programming|scripting|scripts|debugging|code reviews"
  - "develop applications|developing applications|build applications|building applications|web applications|mobile applications|apps"
  - "api|apis|microservices|backend|back end|frontend|front end|full stack"
  - "unit tests|test automation|automated testing|software testing"
  - "data pipelines|etl|data engineering|databases|database|sql|data models|data modelling"
  - "data science|statistical models|predictive models|quantitative models"
  - "machine learning|deep learning|ml models|ai models|neural networks|computer vision|natural language processing|nlp|large language models|llm|llms"
  - "algorithms|computational|mathematical modelling|simulation|simulations|operational research"
  - "python|java|c++|c#|javascript|typescript|matlab|scala|rust|golang"
  - "cyber security|cybersecurity|information security|penetration testing|vulnerabilities|vulnerability|threat detection|security operations|incident response"
  - "cloud|aws|azure|gcp|kubernetes|docker|devops|ci/cd|it infrastructure|cloud infrastructure|servers|linux|networking|network engineering"
  - "it support|service desk|technical support|systems administration"
  - "embedded|firmware|fpga|hardware design|robotics|simulation software|electronics|circuits|pcb|control systems|control software|simulink"
  - "data analytics|data analysis|power bi|tableau|dashboards"
