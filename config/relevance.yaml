# Role assessment: separate findings read from the posting's own text, from
# the listing that belongs to that Tracker ID - never the title alone.
# Logic: tracker/relevance.py (role, study level, degree subject),
# tracker/deadline_extract.py (deadline), tracker/role_filter.py (the sheet).
#
# A row leaves the Internships sheet only on firm, quoted evidence: role
# NOT_TECHNICAL, study level GRADUATE_ONLY / POSTGRADUATE_ONLY / EXPERIENCED,
# or a required OTHER_SUBJECT_ONLY - or an employer-confirmed deadline that
# has passed, or an explicitly closed posting. Everything unclear or not yet
# assessed stays visible for review. A row with the user's status or note
# never leaves.
#
# Phrases are matched case-insensitively on word boundaries; a space also
# matches "-", "/", "&" or several spaces.

# Off until the user approves the dry run (`main.py assess --dry-run`). While
# false, nothing here changes the workbook, the nightly scan, verification or
# the calendar. True: the rules above decide the sheet, an Assessment sheet
# explains every row, and verification gathers deadline evidence.
apply_to_workbook: false

# Shown in every dry-run report for the user to review. Never acted on: the
# profile is only changed by the user.
profile_review_note: >-
  data/profile.json says graduation_year 2029, but your CVs say you graduate
  in June 2028. Personal eligibility (Eligible for You) uses the profile as
  configured. Please confirm which is right; nothing changes it automatically.

# Towns that name a posting's place, on top of careers.uk_places, so a
# listing for another office is recognised as such.
extra_places: [chester, watford, halifax, northampton, knutsford, gloucester, cheltenham, stevenage,
               farnborough, filton, broughton, barrow, telford, lincoln, hull, peterborough, derby,
               luton, warrington, preston, bournemouth, ipswich, norwich, sunderland, crewe, harrogate,
               portsmouth, plymouth, chelmsford, woking, slough, maidenhead, bracknell, wolverhampton]

# Text shorter than this cannot show duties, requirements and eligibility.
min_text_chars: 400

# Section headings as they appear inside a flattened posting. A heading counts
# where a sentence starts or where it is followed by ":" or "?".
headings:
  duties: ["what you'll do", "what you will do", "what you'll be doing", "what you will be doing",
           "what will you be doing", "what you could be doing", "the work you could be doing",
           "you could gain experience in", "you'll gain experience in", "what the role involves",
           "the role involves", "responsibilities", "your responsibilities", "key responsibilities",
           "main responsibilities", "accountabilities", "purpose of the role", "about the role",
           "the role", "your role", "role overview", "role description", "job description",
           "the opportunity", "day to day", "day-to-day", "a day in the life", "what you'll work on",
           "what you will work on", "your day", "the job", "job purpose", "what you will learn",
           "what you'll learn", "the programme", "the placement", "the internship",
           "about the internship", "about the placement", "about the programme", "role summary",
           "position summary", "key tasks", "duties", "your duties", "what's involved"]
  requirements: ["requirements", "what you need", "what you need to apply", "what do you need",
                 "what we're looking for", "what we are looking for", "who we're looking for",
                 "who we are looking for", "who you are", "about you", "you will have", "you'll have",
                 "you will need", "you'll need", "skills and experience", "skills & experience",
                 "qualifications", "essential criteria", "desirable criteria", "essential skills",
                 "eligibility", "eligibility criteria", "who can apply", "entry requirements",
                 "minimum qualifications", "preferred qualifications", "basic qualifications",
                 "what you'll bring", "what you will bring", "the ideal candidate", "person specification",
                 "requirements and experience", "we'd love to hear from you if", "to be considered",
                 "person specifications", "what we're looking for from you", "what we are looking for from you",
                 "your skills", "skills required", "key skills", "about you and your skills"]
  background: ["about us", "who we are", "about the company", "about the team", "our team", "benefits",
               "what we offer", "what's in it for you", "what we can offer", "why join us", "why join",
               "application process", "how to apply", "support to succeed", "our commitment",
               "diversity", "equal opportunities", "locations", "location", "opening and closing date",
               "closing date", "salary", "perks", "rewards", "our values", "our culture",
               "additional information", "next steps", "the process", "recruitment process",
               "working at", "life at", "inclusion", "accessibility", "reasonable adjustments"]

